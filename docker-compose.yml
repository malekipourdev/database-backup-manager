name: mysql-backup-panel

services:
  backend:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    environment:
      MBP_ENCRYPTION_KEY: ${MBP_ENCRYPTION_KEY:?Set MBP_ENCRYPTION_KEY in .env}
      MBP_ADMIN_USERNAME: ${MBP_ADMIN_USERNAME:-admin}
      MBP_ADMIN_PASSWORD: ${MBP_ADMIN_PASSWORD:-}
      MBP_DATABASE_URL: ${MBP_DATABASE_URL:-sqlite:////data/mbp.db}
      MBP_COOKIE_SECURE: ${MBP_COOKIE_SECURE:-true}
      MBP_BACKUP_CONCURRENCY: ${MBP_BACKUP_CONCURRENCY:-2}
      MBP_RETENTION_INTERVAL_MINUTES: ${MBP_RETENTION_INTERVAL_MINUTES:-60}
      MBP_SCHEDULE_MISFIRE_GRACE_SECONDS: ${MBP_SCHEDULE_MISFIRE_GRACE_SECONDS:-300}
      MBP_MONITOR_INTERVAL_MINUTES: ${MBP_MONITOR_INTERVAL_MINUTES:-10}
      MBP_BOTS_ENABLED: ${MBP_BOTS_ENABLED:-true}
    volumes:
      - mbp-data:/data
      # Backup files. To keep them in a host directory instead, replace with e.g.
      # "./backups:/backups" and run "chown 10001:10001 ./backups" once.
      - mbp-backups:/backups
    # Lets admins reach database servers on the host machine as "host.docker.internal".
    # Target databases are reached over the network only; docker.sock is never mounted here
    # (only the optional agent below has it).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      # The panel's own containers can never be stopped or restarted from the panel.
      mbp.role: panel
    networks:
      - mbp-net
    # No published ports: only the frontend proxy talks to the backend.

  frontend:
    build: ./frontend
    restart: unless-stopped
    # Bound to the loopback interface by default, so the panel is reachable only from the
    # server itself (e.g. through an SSH tunnel). Docker bypasses host firewalls such as ufw,
    # so a 0.0.0.0 binding would expose the panel to the network.
    ports:
      - "${MBP_BIND_ADDRESS:-127.0.0.1}:${MBP_HTTP_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    labels:
      mbp.role: panel
    networks:
      - mbp-net

  # Container management (optional, off by default). The only service with docker.sock,
  # which is equivalent to root on the host. Turn it on with COMPOSE_PROFILES=containers
  # and MBP_DOCKER_GID (the group of the socket) in .env; see the README.
  agent:
    build:
      context: ./backend
      target: agent
    profiles: ["containers"]
    restart: unless-stopped
    environment:
      # The backend and the agent derive their shared token from this key.
      MBP_ENCRYPTION_KEY: ${MBP_ENCRYPTION_KEY:?Set MBP_ENCRYPTION_KEY in .env}
      MBP_PROJECTS_DIR: ${MBP_PROJECTS_DIR:-/opt/mbp-projects}
    group_add:
      - "${MBP_DOCKER_GID:-999}"
    volumes:
      - ${MBP_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      # Deployed projects, at the same path as on the host: relative bind mounts in their
      # compose files ("./data:/data") then point to the right host directories.
      - ${MBP_PROJECTS_DIR:-/opt/mbp-projects}:${MBP_PROJECTS_DIR:-/opt/mbp-projects}
    tmpfs:
      - /tmp
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    labels:
      mbp.role: agent
    networks:
      - mbp-net
    # No published ports: only the backend talks to the agent, on the internal network.

networks:
  mbp-net:
    name: mbp-net

volumes:
  mbp-data:
  mbp-backups:
