[project]
name = "mbp"
version = "0.1.0"
description = "MySQL Backup Panel backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pymysql>=1.1",
    "psycopg[binary]>=3.2",
    "cryptography>=42",
    "argon2-cffi>=23.1",
    "apscheduler>=3.10,<4",
    "boto3>=1.34",
    "tzdata>=2024.1",
    "httpx[socks]>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "testcontainers[mysql]>=4.7",
    "ruff>=0.6",
    "moto[s3,server]>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mbp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not integration'"
markers = ["integration: requires Docker (MySQL/MariaDB containers)"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S108", "S311", "S603", "S607", "S608"]
"migrations/**" = ["E501"]
# Translation strings are kept on one line each.
"src/mbp/bots/texts.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.ruff.format]
quote-style = "double"
